name: Playwright E2E Report

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
    workflow_dispatch:
    pull_request:
        types: [opened, synchronize, reopened]
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read
    checks: write

jobs:
    e2e:
        name: Playwright Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup VP
              uses: voidzero-dev/setup-vp@v1

            - name: Install Dependencies
              run: npm ci

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps chromium

            - name: Run Playwright Tests
              run: npx playwright test --reporter=github,html,junit
              env:
                  PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/playwright-junit.xml

            - name: Upload Playwright HTML Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-html-report
                  path: playwright-report
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Upload Playwright JUnit XML
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-junit-report
                  path: test-results/playwright-junit.xml
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Publish Unit Test Summary
              if: always()
              uses: EnricoMi/publish-unit-test-result-action@v2
              with:
                  files: test-results/playwright-junit.xml

    deploy_report_to_pages:
        name: Deploy Playwright Report to GitHub Pages
        needs: e2e
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.e2e.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
            contents: read
        steps:
            - name: Download Playwright HTML Report Artifact
              uses: actions/download-artifact@v4
              with:
                  name: playwright-html-report
                  path: playwright-report

            - name: Setup GitHub Pages
              uses: actions/configure-pages@v5

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: playwright-report

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
